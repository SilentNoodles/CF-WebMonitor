name = "cf-webmonitor"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# Run every 5 minutes. Free-tier friendly; do not go much tighter or the
# site is more likely to rate-limit or block the Worker.
[triggers]
crons = ["*/5 * * * *"]

# Small key/value store for the last-seen state of each watch.
# Create it once with:  npx wrangler kv namespace create STATE
# then paste the printed id below.
[[kv_namespaces]]
binding = "STATE"
id = "074d846b6e894476b67391136f32e645"

# Non-secret settings. Secrets (Telegram token etc.) are set with
# `wrangler secret put`, never committed. See README.
[vars]
# Consecutive failed checks (blocked / unexpected response) before a
# "monitor is broken" alert is sent.
FAILURE_ALERT_AFTER = "3"
# While the product stays available, re-send the alert this often (minutes).
REALERT_MINUTES = "30"
# Secondary check of the product page's button/price lookup. Informational
# only, and unverified without the site's own request headers (which we do
# not send). "on" to enable; off by default.
CTA_CHECK = "off"
